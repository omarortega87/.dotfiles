# Tmux configuration file

# Set prefix key to Ctrl-a (instead of default Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Set default terminal mode to 256color mode
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Set scrollback buffer to 10000
set -g history-limit 10000

# Catppuccin Mocha Theme Colors
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black4="#585b70"

# Modern status line configuration - Catppuccin Mocha
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=$thm_bg,fg=$thm_fg"
set -g status-left-length 40
set -g status-right-length 60
set -g status-interval 5

# Left side: session name with Catppuccin styling
set -g status-left "#[bg=$thm_blue,fg=$thm_black,bold] #S #[bg=$thm_bg,fg=$thm_blue]"

# Right side: Catppuccin info display
set -g status-right "#[fg=$thm_black4]#[bg=$thm_black4,fg=$thm_bg] %m/%d #[bg=$thm_blue,fg=$thm_black,bold] %H:%M "

# Window status styling - Catppuccin enhanced
set -g window-status-current-style "bg=$thm_blue,fg=$thm_black,bold"
set -g window-status-current-format " #I:#W#{?window_zoomed_flag,🔍,}#{?window_flags,#{window_flags}, } "

set -g window-status-style "bg=$thm_gray,fg=$thm_fg"
set -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "

# Window status activity and bell styling - Catppuccin colors
set -g window-status-activity-style "bg=$thm_red,fg=$thm_black,bold"
set -g window-status-bell-style "bg=$thm_orange,fg=$thm_black,bold"

# Window separator - minimal to maximize space
set -g window-status-separator ''

# Message styling - Catppuccin
set -g message-style "bg=$thm_blue,fg=$thm_black,bold"
set -g message-command-style "bg=$thm_blue,fg=$thm_black,bold"

# Pane border styling - Catppuccin colors
set -g pane-border-style "fg=$thm_black4"
set -g pane-active-border-style "fg=$thm_blue"

# Copy mode styling - Catppuccin
set -g mode-style "bg=$thm_blue,fg=$thm_black,bold"

# Enable vi mode
setw -g mode-keys vi

# Vi-style copy mode bindings (optimized for macOS)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Reload config file with 'r'
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch panes using vim-style keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + arrow keys
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Resize panes with vim-style keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Create new window with 'c' and name it
bind c new-window
bind , command-prompt "rename-window '%%'"

# Switch between sessions
bind s choose-session

# Kill pane/window confirmations
bind x kill-pane
bind & kill-window

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when a window is closed
set -g renumber-windows on

# No delay for escape key press
set -sg escape-time 0

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Enable focus events
set -g focus-events on

# Don't rename windows automatically
set-option -g allow-rename off

# Increase message display time
set -g display-time 2000

# Enable aggressive resize
setw -g aggressive-resize on
